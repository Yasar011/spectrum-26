    <style>
        :root { 
            --bg-base: #030712; 
        }
        body { 
            background-color: var(--bg-base); 
            color: #fff; 
            font-family: 'Outfit', sans-serif; 
            overflow-x: hidden;
        }
        .font-display { font-family: 'Oswald', sans-serif; }
        .font-mono { font-family: 'Space Mono', monospace; }
        
        .glass-panel { 
            background: rgba(15, 23, 42, 0.6); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            backdrop-filter: blur(24px); 
        }

        /* Glitch Effect */
        .glitch-text { position: relative; display: inline-block; }
        .glitch-text::before, .glitch-text::after { 
            content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: transparent; opacity: 0.8; mix-blend-mode: screen; 
        }
        .glitch-text::before { left: 2px; text-shadow: -2px 0 #06b6d4; animation: glitch-1 3s infinite linear alternate-reverse; }
        .glitch-text::after { left: -2px; text-shadow: -2px 0 #ec4899; animation: glitch-2 4s infinite linear alternate-reverse; }
        @keyframes glitch-1 { 0% { clip-path: inset(20% 0 80% 0); } 100% { clip-path: inset(80% 0 5% 0); } }
        @keyframes glitch-2 { 0% { clip-path: inset(10% 0 60% 0); } 100% { clip-path: inset(30% 0 20% 0); } }

        /* Timeline Specifics */
        .timeline-container { position: relative; }
        .timeline-container::before {
            content: '';
            position: absolute;
            top: 0; left: 16px; height: 100%; width: 2px;
            background: linear-gradient(to bottom, #06b6d4, #ec4899);
            opacity: 0.3;
        }
        @media (min-width: 768px) {
            .timeline-container::before { left: 50%; transform: translateX(-50%); }
        }

        .timeline-dot {
            position: absolute; left: 16px; transform: translateX(-50%);
            width: 16px; height: 16px; border-radius: 50%;
            background-color: #030712; border: 4px solid #06b6d4;
            z-index: 10;
        }
        @media (min-width: 768px) {
            .timeline-dot { left: 50%; }
        }
        
        .tab-btn { transition: all 0.3s ease; }
        .tab-btn.active { background: linear-gradient(90deg, rgba(6,182,212,0.2), rgba(236,72,153,0.2)); border-color: #06b6d4; color: white; }

        .animate-in { animation: fadeUp 0.5s ease-out forwards; opacity: 0; transform: translateY(20px); }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

        // Helper to convert time strings (like "8:00 AM") to minutes for sorting
        function parseTime(timeStr) {
            if (!timeStr) return 9999; 
            const match = timeStr.match(/(\d+):(\d+)\s+(AM|PM)/i);
            if (!match) return 9999;
            
            let hours = parseInt(match[1], 10);
            const mins = parseInt(match[2], 10);
            const period = match[3].toUpperCase();

            if (period === 'PM' && hours !== 12) hours += 12;
            if (period === 'AM' && hours === 12) hours = 0;

            return (hours * 60) + mins;
        }

        // Render Schedule for a Specific Day
        function renderSchedule(dayFilter) {
            const container = document.getElementById('schedule-container');
            container.innerHTML = '';
            
            // Filter and Sort Events
            const dayEvents = eventsData
                .filter(e => e.day === dayFilter)
                .sort((a, b) => parseTime(a.time) - parseTime(b.time));

            if(dayEvents.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-500 py-20 font-mono">No events scheduled for ${dayFilter}.</div>`;
                return;
            }

            // Generate Timeline HTML
            let html = '';
            let animationDelay = 0;

            dayEvents.forEach((event, index) => {
                // Alternate left/right alignment on desktop
                const isEven = index % 2 === 0;
                const rowAlignClass = isEven ? 'md:flex-row-reverse' : 'md:flex-row';
                const textColClass = isEven ? 'md:text-right md:mr-12' : 'md:ml-12';
                const timeColClass = isEven ? 'md:text-left md:ml-12' : 'md:text-right md:mr-12';
                
                // Colors based on premium/club
                const highlightColor = event.isPremium ? 'text-pink-400' : 'text-cyan-400';
                const dotColorClass = event.isPremium ? 'border-pink-500' : 'border-cyan-500';

                html += `
                <div class="relative flex flex-col md:flex-row items-center w-full mb-8 animate-in pl-12 md:pl-0" style="animation-delay: ${animationDelay}s;">
                    <!-- Timeline Dot -->
                    <div class="timeline-dot ${dotColorClass}"></div>
                    
                    <!-- Time Display -->
                    <div class="w-full md:w-1/2 ${timeColClass} mb-2 md:mb-0 hidden md:block">
                        <span class="text-xl font-display font-bold text-white tracking-widest">${event.time}</span>
                    </div>

                    <!-- Event Card -->
                    <div class="w-full md:w-1/2 ${textColClass}">
                        <div class="glass-panel p-6 rounded-2xl hover:border-white/30 transition-colors inline-block w-full text-left">
                            <div class="flex items-center gap-3 mb-3 md:hidden">
                                <i data-lucide="clock" class="w-4 h-4 text-gray-400"></i>
                                <span class="text-sm font-mono font-bold text-white">${event.time}</span>
                            </div>
                            
                            <span class="text-[9px] font-bold uppercase tracking-widest bg-white/10 px-2 py-1 rounded text-gray-300 mb-2 inline-block">${event.club}</span>
                            ${event.isPremium ? '<span class="text-[9px] font-bold uppercase tracking-widest bg-pink-500/20 px-2 py-1 rounded text-pink-400 mb-2 inline-block ml-2"><i data-lucide="star" class="w-3 h-3 inline pb-0.5"></i> Flagship</span>' : ''}
                            
                            <h3 class="text-2xl font-bold text-white mb-2">${event.title}</h3>
                            
                            <div class="space-y-1 text-xs text-gray-400 font-mono">
                                <p class="flex items-center gap-2 ${isEven ? 'md:justify-end' : ''}"><i data-lucide="map-pin" class="w-3 h-3 ${highlightColor}"></i> ${event.venue}</p>
                                <p class="flex items-center gap-2 ${isEven ? 'md:justify-end' : ''}"><i data-lucide="users" class="w-3 h-3 text-blue-400"></i> ${event.members}</p>
                            </div>
                        </div>
                    </div>
                </div>`;
                
                animationDelay += 0.05; // Staggered entrance animation
            });

            container.innerHTML = html;
            lucide.createIcons();
        }

        // Tab Switcher
        function switchDay(day) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${day}`).classList.add('active');
            renderSchedule(day);
        }

        // Initialize with Day 1
        document.addEventListener('DOMContentLoaded', () => {
            switchDay('Day 1');
        });

    </script>
